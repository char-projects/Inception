networks:
  inception:
    driver: bridge

volumes:
  db:
    driver: local
    driver_opts:
      type: none
      device: /home/${USER}/data/db
      o: bind
  web:
    driver: local
    driver_opts:
      type: none
      device: /home/${USER}/data/web
      o: bind

services:
  nginx:
    build:
      context: ..
      dockerfile: srcs/requirements/nginx/Dockerfile
    container_name: nginx
    ports:
        - "443:443"
    depends_on:
      - wordpress
    volumes:
      - web:/var/www/html
    networks:
      - inception
    restart: always
  wordpress:
    build:
      context: ..
      dockerfile: srcs/requirements/wordpress/Dockerfile
    container_name: wordpress
    depends_on:
      - mariadb
    volumes:
      - web:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    restart: always
  mariadb:
    build:
      context: ..
      dockerfile: srcs/requirements/mariadb/Dockerfile
    container_name: mariadb
    volumes:
      - db:/var/lib/mysql
    env_file:
      - .env
    networks:
      - inception
    restart: always
